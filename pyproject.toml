[project]
name = "html2mp4"
version = "0.1.0"
description = "Render narrated HTML slide modules into professional 1080p MP4 videos with neural voiceover, captions and background music."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "kokoro>=0.9.4",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "playwright>=1.45",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pyloudnorm>=0.1",
]

[project.scripts]
html2mp4 = "html2mp4.cli:main"
html2mp4-music = "html2mp4.music:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
