[project]
name = "html2mp4"
version = "0.3.0"
description = "Turn narrated HTML slide modules into finished training videos with voiceover, captions and music, locally."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Akash Adhikary" }]
keywords = ["e-learning", "video", "text-to-speech", "html", "slides", "captions", "playwright", "kokoro"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: Education :: Computer Aided Instruction (CAI)",
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "kokoro>=0.9.4",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "playwright>=1.45",
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pyloudnorm>=0.1",
    "imageio-ffmpeg>=0.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/akash-adhikary/narrated-slides-to-video"
Documentation = "https://github.com/akash-adhikary/narrated-slides-to-video/tree/main/docs"
Issues = "https://github.com/akash-adhikary/narrated-slides-to-video/issues"
Changelog = "https://github.com/akash-adhikary/narrated-slides-to-video/blob/main/CHANGELOG.md"

[project.scripts]
html2mp4 = "html2mp4.cli:main"
html2mp4-music = "html2mp4.music:main"
html2mp4-studio = "html2mp4.studio:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
